# A generic, single database configuration.

[alembic]
# path to migration script directory
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters in --autogenerate title
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be detected as revisions in the
# script_dir
# sourceless = false

# version location specification; This defaults
# to alembic/versions. When multiple version
# directories are required, use a list of paths
# separated by module path separators.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# set to 'true' to search source_path recursively
# for migrations
# recursive_version_locations = false

# output_encoding = utf-8

sqlalchemy.url = postgresql+psycopg2://ausa_user:ausa_password@localhost:5432/ausa_db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
